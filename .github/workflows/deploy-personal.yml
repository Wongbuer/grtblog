name: Deploy Personal Site

on:
  push:
    branches:
      - personal/main
  workflow_dispatch:

concurrency:
  group: deploy-personal-site
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  APP_VERSION: personal
  GHCR_OWNER: wongbuer
  GHCR_REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: grtblog-server
            dockerfile: deploy/docker/server.Dockerfile
          - name: grtblog-renderer
            dockerfile: deploy/docker/web.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/${{ matrix.image.name }}:${{ env.APP_VERSION }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/${{ matrix.image.name }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: personal/main
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_REPO_PREFIX: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_SSH_KEY}" ] || [ -z "${GHCR_TOKEN}" ]; then
            echo "Missing DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, or GHCR_TOKEN." >&2
            exit 1
          fi
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/grtblog}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/grtblog_deploy_key
          chmod 600 ~/.ssh/grtblog_deploy_key
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/grtblog_deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' REPOSITORY='${REPOSITORY}' REVISION='${REVISION}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' IMAGE_REPO_PREFIX='${IMAGE_REPO_PREFIX}' APP_VERSION='${APP_VERSION}' bash -s" <<'REMOTE'
          set -euo pipefail

          if ! command -v git >/dev/null 2>&1; then
            echo "git is required on the server." >&2
            exit 1
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker is required on the server." >&2
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin is required on the server." >&2
            exit 1
          fi

          mkdir -p "$(dirname "${DEPLOY_PATH}")"

          if [ ! -d "${DEPLOY_PATH}/.git" ]; then
            rm -rf "${DEPLOY_PATH}.tmp"
            git clone --branch "${DEPLOY_BRANCH}" "https://github.com/${REPOSITORY}.git" "${DEPLOY_PATH}.tmp"
            mv "${DEPLOY_PATH}.tmp" "${DEPLOY_PATH}"
          fi

          cd "${DEPLOY_PATH}"
          git fetch origin "${DEPLOY_BRANCH}"
          git reset --hard "${REVISION}"

          cd deploy
          if [ ! -f .env ]; then
            echo "Missing ${DEPLOY_PATH}/deploy/.env. Create it on the server before deploying." >&2
            exit 1
          fi

          mkdir -p storage/html storage/uploads storage/geoip
          printf '%s\n' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          if grep -q '^IMAGE_REPO_PREFIX=' .env; then
            sed -i "s|^IMAGE_REPO_PREFIX=.*|IMAGE_REPO_PREFIX=${IMAGE_REPO_PREFIX}|" .env
          else
            printf '\nIMAGE_REPO_PREFIX=%s\n' "${IMAGE_REPO_PREFIX}" >> .env
          fi

          if grep -q '^APP_VERSION=' .env; then
            sed -i "s|^APP_VERSION=.*|APP_VERSION=${APP_VERSION}|" .env
          else
            printf '\nAPP_VERSION=%s\n' "${APP_VERSION}" >> .env
          fi

          docker compose pull
          docker compose up -d --no-build
          docker compose ps
          REMOTE
